# Reusable workflow: plan or apply this stack in a host repository.
#
# on: workflow_call only, so this file does not run in the factory
# repository. The host calls it from .github/workflows/factory-labels.yml.
# Permissions are whatever that caller grants. Plan needs contents: read
# and issues: read. Apply needs contents: write and issues: write.
# A called workflow cannot raise the caller's token.
#
# The passphrase arrives as secrets.state_passphrase. This file does not
# name a repository or a secret. github.repository is the host.

name: Labels

on:
  workflow_call:
    inputs:
      action:
        description: "plan or apply"
        required: true
        type: string
    secrets:
      state_passphrase:
        description: "Passphrase for state encryption. Each host passes its own."
        required: true

# One queue per host, shared by plan and apply. An apply is not cancelled
# to make room for the next run.
concurrency:
  group: factory-labels-${{ github.repository }}
  cancel-in-progress: false

jobs:
  labels:
    name: ${{ inputs.action }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: "1"
      TF_VAR_github_repository: ${{ github.repository }}
      TF_VAR_state_passphrase: ${{ secrets.state_passphrase }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ACTION: ${{ inputs.action }}

    steps:
      - name: Check action
        run: |
          set -euo pipefail
          case "$ACTION" in
            plan|apply) ;;
            *)
              echo "action must be plan or apply (got '${ACTION}')."
              exit 1
              ;;
          esac

      # push and pull_request payloads include repository.default_branch.
      # workflow_dispatch's documented payload is inputs, ref, and workflow.
      # Actions often still attaches repository; when the field is empty,
      # ask the API. Do not guess a branch name.
      - name: Resolve the host default branch
        id: default-branch
        if: inputs.action == 'apply'
        env:
          FROM_EVENT: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          branch="${FROM_EVENT}"
          if [ -z "$branch" ]; then
            echo "repository.default_branch is not in the event payload. Asking the API."
            branch="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .default_branch)"
          fi
          if [ -z "$branch" ] || [[ "$branch" == *$'\n'* ]] || [[ "$branch" == *' '* ]]; then
            echo "Could not determine the host's default branch."
            exit 1
          fi
          echo "branch=${branch}" >> "$GITHUB_OUTPUT"
          echo "Default branch is ${branch}."

      - name: Apply only on the default branch
        if: inputs.action == 'apply'
        env:
          DEFAULT_BRANCH: ${{ steps.default-branch.outputs.branch }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "apply is only allowed from the default branch ${DEFAULT_BRANCH} (got ${GITHUB_REF})."
            exit 1
          fi

      - name: Require state passphrase
        run: |
          set -euo pipefail
          if [ -z "${TF_VAR_state_passphrase}" ]; then
            echo "The caller did not pass secrets.state_passphrase."
            echo "Create the host's passphrase secret and pass it from factory-labels.yml."
            exit 1
          fi

      # github.* is the caller, so this is the host repository.
      # The ref is set explicitly: for a pull request it is that pull
      # request's merge commit, and for a push it is the commit that was pushed.
      - name: Checkout host repository
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 1

      - name: Install OpenTofu 1.13.2
        uses: opentofu/setup-opentofu@v2.0.2
        with:
          tofu_version: "1.13.2"
          tofu_wrapper: false

      - name: Init
        working-directory: .factory
        run: |
          set -euo pipefail
          # The factory ships no state/ directory. Apply creates the file.
          # plan and apply validate the configuration themselves.
          mkdir -p state
          tofu init -input=false

      - name: Plan
        if: inputs.action == 'plan'
        working-directory: .factory
        run: tofu plan -input=false -no-color

      - name: Apply
        if: inputs.action == 'apply'
        working-directory: .factory
        run: tofu apply -auto-approve -input=false -no-color

      - name: Commit encrypted state on the default branch
        if: inputs.action == 'apply'
        env:
          EXPECTED_SHA: ${{ github.sha }}
          DEFAULT_BRANCH: ${{ steps.default-branch.outputs.branch }}
        run: |
          set -euo pipefail

          if [ ! -f .factory/state/terraform.tfstate ]; then
            echo "OpenTofu did not write .factory/state/terraform.tfstate."
            exit 1
          fi

          # This exact path only. -f so a host gitignore of *.tfstate*
          # does not hide it. Backups and lock files stay untracked.
          git add -f -- .factory/state/terraform.tfstate

          if git diff --cached --quiet; then
            echo "Encrypted state is unchanged. Nothing to commit."
            exit 0
          fi

          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Update encrypted OpenTofu state for issue labels"

          parent="$(git rev-parse HEAD^)"
          if [ "$parent" != "$EXPECTED_SHA" ]; then
            echo "Refusing to push: parent ${parent} is not the checked-out commit ${EXPECTED_SHA}."
            exit 1
          fi

          git push origin "HEAD:refs/heads/${DEFAULT_BRANCH}"
